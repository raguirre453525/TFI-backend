name: CI/CD Backend

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "8.0.x"
  PROJECT_PATH: "Dsw2025Tpi.Api/Dsw2025Tpi.Api.csproj"
  DOCKERHUB_USERNAME: claudioj02
  IMAGE_NAME: tfi-backend

jobs:
  validar:
    name: Validar backend
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar paquetes
        run: dotnet restore "$PROJECT_PATH"

      - name: Limpiar compilación
        run: dotnet clean "$PROJECT_PATH" --configuration Release

      - name: Compilar backend
        run: >
          dotnet build "$PROJECT_PATH"
          --configuration Release
          --no-restore

      - name: Construir imagen Docker
        run: |
          docker build \
            -t "$DOCKERHUB_USERNAME/$IMAGE_NAME:$GITHUB_SHA" \
            -t "$DOCKERHUB_USERNAME/$IMAGE_NAME:latest" \
            -f Dockerfile \
            .

      - name: Iniciar sesión en Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar imagen en Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$DOCKERHUB_USERNAME/$IMAGE_NAME:$GITHUB_SHA"
          docker push "$DOCKERHUB_USERNAME/$IMAGE_NAME:latest"

      - name: Desplegar en Azure
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.APP_SERVICE_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: '${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'